<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker - Arquitectura de Hábitos</title>
    
    <!-- 1. Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <!-- 2. Tus estilos CSS personalizados (opcional, va después de Bootstrap) -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

    <!-- Contenido principal -->
    <div class="container py-5">
        <header class="text-center mb-5">
            <h1 class="fw-bold text-primary">Habit Tracker 🏠</h1>
            <p class="text-muted">Construye tu disciplina, edifica tu casa.</p>
        </header>

        <!-- Aquí irá tu listado de hábitos y tarjetas estilo Clash Royale -->
        <main id="app-container">
            <div class="alert alert-info text-center" role="alert">
                ¡Entorno configurado correctamente! Listos para programar.
            </div>
        </main>
    </div>

    <!-- 3. Bootstrap 5 JS Bundle CDN (Incluye Popper para modales y dropdowns) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
    <!-- 4. Tus scripts de JavaScript -->
    <script src="js/app.js"></script>
</body>
</html>
