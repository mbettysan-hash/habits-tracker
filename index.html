<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker - Arquitectura de Hábitos</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100 justify-content-between overflow-hidden">

    <!-- Encabezado y Acción Principal -->
    <main class="container text-center pt-5 mt-4">
        <h1 class="display-3 fw-bold mb-4" style="letter-spacing: 1px;">Habit Tracker</h1>
        
        <div class="d-flex justify-content-center">
            <button id="btn-start" class="btn btn-game btn-lg px-5 py-3 fs-3 d-flex align-items-center gap-2">
                <span>Iniciar</span>
                <span class="fs-4">▶</span>
            </button>
        </div>
    </main>

    <!-- Planeta animado en la parte inferior -->
    <div class="planet-container">
        <div class="planet" id="earth-planet"></div>
    </div>

    <!-- Bootstrap & App JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
