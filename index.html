<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker - Arquitectura de Hábitos</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Tus estilos personalizados -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100 justify-content-between overflow-hidden position-relative bg-light">

    <!-- ==========================================
       VISTA 1: PANTALLA DE BIENVENIDA (PLANETA)
       ========================================== -->
    <div id="view-welcome" class="d-flex flex-column min-vh-100 justify-content-between w-100">
        <main class="container text-center pt-5 mt-4">
            <h1 class="display-3 fw-bold mb-4" style="letter-spacing: 1px;">Habit Tracker</h1>
            
            <div class="d-flex justify-content-center">
                <button id="btn-start" class="btn btn-game btn-lg px-5 py-3 fs-3 d-flex align-items-center gap-2">
                    <span>Iniciar</span>
                    <span class="fs-4">▶</span>
                </button>
            </div>
        </main>

        <!-- Planeta animado en la parte inferior -->
        <div class="planet-container">
            <div class="planet"></div>
        </div>
    </div>


    <!-- ==========================================
       VISTA 2: MENÚ PRINCIPAL (SOL Y BOTONES)
       ========================================== -->
    <div id="view-menu" class="d-none d-flex flex-column min-vh-100 justify-content-between w-100 position-relative">
        
        <!-- Sol con llamaradas en la esquina superior derecha -->
        <div class="sun-container">
            <div class="sun"></div>
        </div>

        <!-- Botón para regresar -->
        <header class="container pt-4 z-2">
            <button id="btn-back" class="btn btn-game btn-sm px-3 py-2 fw-bold">◀ Volver</button>
        </header>

        <!-- Botones del Menú Principal -->
        <main class="container text-center my-auto z-2" style="max-width: 550px;">
            <div class="d-flex flex-column gap-3">
                <button class="btn btn-game py-3 fs-4 d-flex justify-content-between align-items-center px-4">
                    <span>Nuevo Hábito</span>
                    <span>🤓</span>
                </button>
                <button class="btn btn-game py-3 fs-4 d-flex justify-content-between align-items-center px-4">
                    <span>Continúa Creciendo</span>
                    <span>📈</span>
                </button>
                <button class="btn btn-game py-3 fs-4 d-flex justify-content-between align-items-center px-4">
                    <span>Colección Recompensas</span>
                    <span>🏆</span>
                </button>
            </div>
        </main>

        <footer class="text-center pb-4 text-muted small z-2">
            Habit Tracker - MVP
        </footer>
    </div>


    <!-- Bootstrap & JS de la aplicación -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
